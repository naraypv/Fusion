name: Isolated LifeOS project-migration proof

on:
  push:
    branches:
      - proof/lifeos-project-migration-20260911

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Verify exact non-sensitive models
        shell: bash
        run: |
          set -euo pipefail
          root=proofs/lifeos-project-migration-20260911
          test "$(git hash-object "$root/project_migration.qnt")" = e9439213c4522e2d297d88e667e37042f20fa4be
          test "$(git hash-object "$root/project_migration_test.qnt")" = 176d8d0bfe51249b3a77944ff3fe01c7932790b3
          test "$(git hash-object "$root/project_migration_mutant.qnt")" = 8ff814524097203f9e958a57180fd2dfb1d04ea1

      - name: Install pinned Quint
        shell: bash
        run: |
          set -euo pipefail
          npm install --global @informalsystems/quint@0.32.0
          test "$(quint --version)" = '0.32.0'

      - name: Execute proof and mutation check
        shell: bash
        run: |
          set -euo pipefail
          root=proofs/lifeos-project-migration-20260911
          mkdir -p evidence
          git rev-parse HEAD > evidence/runner-revision.txt
          quint --version > evidence/quint-version.txt
          sha256sum "$root"/*.qnt > evidence/model-hashes.txt
          cat > evidence/commands.txt <<'COMMANDS'
          quint typecheck project_migration.qnt
          quint typecheck project_migration_mutant.qnt
          quint test project_migration_test.qnt
          quint run project_migration.qnt --invariant=invariant --max-samples=5000 --max-steps=8
          quint verify project_migration.qnt --invariant=invariant --backend=tlc --tlc-config=tlc-config.json
          quint verify project_migration_mutant.qnt --invariant=invariant --backend=tlc --tlc-config=tlc-config.json  # required nonzero
          COMMANDS
          quint typecheck "$root/project_migration.qnt" 2>&1 | tee evidence/typecheck.log
          quint typecheck "$root/project_migration_mutant.qnt" 2>&1 | tee evidence/mutant-typecheck.log
          quint test "$root/project_migration_test.qnt" 2>&1 | tee evidence/tests.log
          quint run "$root/project_migration.qnt" \
            --invariant=invariant --max-samples=5000 --max-steps=8 \
            2>&1 | tee evidence/run.log
          printf '{"maxHeap":"-Xmx2G","workers":2}\n' > evidence/tlc-config.json
          quint verify "$root/project_migration.qnt" \
            --invariant=invariant --backend=tlc \
            --tlc-config=evidence/tlc-config.json \
            2>&1 | tee evidence/verify.log
          set +e
          quint verify "$root/project_migration_mutant.qnt" \
            --invariant=invariant --backend=tlc \
            --tlc-config=evidence/tlc-config.json \
            > evidence/mutant-verify.log 2>&1
          mutant_status=$?
          set -e
          printf '%s\n' "$mutant_status" > evidence/mutant-verify.exit
          if [ "$mutant_status" -eq 0 ]; then
            cat evidence/mutant-verify.log
            echo 'FAIL: destructive overwrite mutant escaped the invariant' >&2
            exit 1
          fi
          echo 'PASS: invariant rejected destructive migration and divergent overwrite' \
            | tee evidence/non-vacuity.log

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: lifeos-project-migration-proof
          path: evidence/
          retention-days: 30
          if-no-files-found: error
